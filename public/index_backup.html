<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPPCL Bijli Mitra — Modern Grievance & Enforcement Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts: Open Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Open Sans', sans-serif; background-color: #f4f6f9; }
    .lavender-box { background-color: #e6e6fa; border: 1px solid #dcdcfe; }
    .badge-orange { background-color: #f97316; color: white; }
    .badge-green { background-color: #10b981; color: white; }
    .badge-red { background-color: #ef4444; color: white; }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    const API_BASE = '/api';

    // Testing Logins (from admin.sql)
    const DEV_USERS = [
      { label: 'Super Admin (admin)', username: 'admin', password: 'Admin@123', role: 'SUPER_ADMIN', badge: 'bg-red-600' },
      { label: 'Super Admin (admin1)', username: 'admin1', password: 'admin123', role: 'SUPER_ADMIN', badge: 'bg-red-700' },
      { label: 'DISCOM (DVVNL)', username: 'DVVNL', password: 'Admin@123', role: 'DISCOM_ADMIN', badge: 'bg-amber-600' },
      { label: 'DISCOM (KeSCO)', username: 'KeSCO', password: 'Admin@123', role: 'DISCOM_ADMIN', badge: 'bg-orange-600' },
      { label: 'DISCOM (MVVNL)', username: 'MVVNL', password: 'Admin@123', role: 'DISCOM_ADMIN', badge: 'bg-yellow-600' },
      { label: 'DISCOM (PuVVNL)', username: 'PuVVNL', password: 'Admin@123', role: 'DISCOM_ADMIN', badge: 'bg-emerald-600' },
      { label: 'DISCOM (PVVNL)', username: 'PVVNL', password: 'Admin@123', role: 'DISCOM_ADMIN', badge: 'bg-blue-600' },
      { label: 'Division (eddrajapur)', username: 'eddrajapur', password: 'Admin@123', role: 'DIVISION_OFFICER', badge: 'bg-indigo-600' },
      { label: 'Division (edd2mahobakp)', username: 'edd2mahobakp', password: 'Admin@123', role: 'DIVISION_OFFICER', badge: 'bg-purple-600' }
    ];

    function App() {
      const [token, setToken] = useState(localStorage.getItem('bm_token') || '');
      const [user, setUser] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('bm_user') || 'null');
        } catch (e) {
          return null;
        }
      });
      const [activeTab, setActiveTab] = useState('not_processed');
      const [counts, setCounts] = useState({ notProcessed: 0, forwarded: 0, closed: 0, total: 0 });
      const [districts, setDistricts] = useState([]);
      const [notification, setNotification] = useState(null);
      const [changePasswordOpen, setChangePasswordOpen] = useState(false);
      const [customLoginOpen, setCustomLoginOpen] = useState(false);
      const [customUsername, setCustomUsername] = useState('');
      const [customPassword, setCustomPassword] = useState('Admin@123');

      // Auto-authenticate as default superadmin if not logged in
      useEffect(() => {
        if (!token) {
          switchUser('admin', 'Admin@123');
        } else {
          fetchDistricts();
          fetchBadgeCounts();
        }
      }, [token]);

      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const switchUser = async (username, password) => {
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Login failed');
          setToken(data.token);
          setUser(data.user);
          localStorage.setItem('bm_token', data.token);
          localStorage.setItem('bm_user', JSON.stringify(data.user));
          notify(`Switched session to ${data.user.username} (${data.user.role})`);
        } catch (err) {
          notify(err.message, 'error');
        }
      };

      const handleLogout = () => {
        setToken('');
        setUser(null);
        localStorage.removeItem('bm_token');
        localStorage.removeItem('bm_user');
        notify('Logged out successfully');
      };

      const fetchDistricts = async () => {
        try {
          const res = await fetch(`${API_BASE}/complaints/meta/districts`);
          const data = await res.json();
          if (data.districts) setDistricts(data.districts);
        } catch (e) {}
      };

      const fetchBadgeCounts = async () => {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/complaints/dashboard/metrics`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.operational) {
            setCounts({
              notProcessed: data.operational.notProcessedCount || 0,
              forwarded: data.operational.forwardCount || 0,
              closed: data.operational.closedCount || 0,
              total: data.operational.totalReceived || 0
            });
          }
        } catch (e) {}
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-md sticky top-0 z-40 border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <img src="/img/uppcllogo.png" alt="UPPCL Logo" className="h-10 w-auto bg-white p-1 rounded" onError={(e) => { e.target.style.display = 'none'; }} />
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    <span>UPPCL BIJLI MITRA</span>
                    <span className="text-xs bg-teal-600 text-teal-100 font-semibold px-2 py-0.5 rounded uppercase">Anti-Theft Grievance Redressal</span>
                  </h1>
                  <p className="text-xs text-slate-400">Uttar Pradesh Power Corporation Limited &mdash; Official Admin Portal</p>
                </div>
              </div>

              {/* Dev Switcher & Profile */}
              <div className="flex items-center flex-wrap gap-2 text-xs">
                <span className="text-slate-400 mr-1 font-semibold hidden md:inline">1-Click Role Switch:</span>
                {DEV_USERS.map(du => (
                  <button
                    key={du.username}
                    onClick={() => switchUser(du.username, du.password)}
                    className={`px-2.5 py-1 rounded font-semibold transition ${user?.username === du.username ? `${du.badge} text-white ring-2 ring-white` : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                  >
                    {du.label}
                  </button>
                ))}

                <button
                  onClick={() => setCustomLoginOpen(true)}
                  className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-teal-300 rounded font-semibold transition border border-teal-500/50 flex items-center gap-1"
                  title="Log in as any of the 440 divisional / DISCOM usernames from admin.sql"
                >
                  <i className="fa-solid fa-arrow-right-to-bracket text-teal-400"></i>
                  <span>Login (440 Accounts)</span>
                </button>

                {user && (
                  <div className="ml-3 pl-3 border-l border-slate-700 flex items-center gap-2">
                    <div className="text-right">
                      <div className="font-bold text-teal-400">{user.username}</div>
                      <div className="text-[10px] text-slate-400 uppercase">{user.role} {user.isReadOnly ? '(View-Only)' : ''}</div>
                    </div>
                    <button
                      onClick={() => setChangePasswordOpen(true)}
                      title="Change Password"
                      className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded text-xs flex items-center gap-1 font-semibold"
                    >
                      <i className="fa-solid fa-key"></i>
                      <span className="hidden sm:inline">Password</span>
                    </button>
                    <button onClick={handleLogout} title="Logout" className="p-1.5 bg-slate-800 hover:bg-red-900 text-slate-300 hover:text-white rounded">
                      <i className="fa-solid fa-right-from-bracket"></i>
                    </button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className={`fixed top-16 right-6 z-50 px-4 py-3 rounded-lg shadow-xl text-sm font-semibold flex items-center gap-2 ${notification.type === 'error' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'} transition`}>
              <i className={`fa-solid ${notification.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* Main Content Area with Sidebar */}
          <div className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
            {/* Sidebar Navigation */}
            <aside className="w-full md:w-64 shrink-0">
              <div className="bg-white rounded-lg shadow border border-slate-200 overflow-hidden sticky top-20">
                <div className="p-4 bg-slate-800 text-white font-bold text-sm flex items-center justify-between">
                  <span className="flex items-center gap-2"><i className="fa-solid fa-bars"></i> Navigation Menu</span>
                  <span className="text-xs bg-slate-700 px-2 py-0.5 rounded text-teal-300 font-mono">v2.0</span>
                </div>
                <nav className="p-2 space-y-1 text-sm font-medium">
                  <button
                    onClick={() => setActiveTab('not_processed')}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'not_processed' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                  >
                    <span className="flex items-center gap-2.5"><i className="fa-solid fa-inbox text-amber-500"></i> Not Processed Queue</span>
                    <span className="badge-orange text-xs px-2 py-0.5 rounded-full font-bold">{counts.notProcessed}</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('forwarded')}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'forwarded' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                  >
                    <span className="flex items-center gap-2.5"><i className="fa-solid fa-share-nodes text-indigo-500"></i> Forwarded Complaints</span>
                    <span className="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">{counts.forwarded || 0}</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('closed')}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'closed' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                  >
                    <span className="flex items-center gap-2.5"><i className="fa-solid fa-check-double text-emerald-600"></i> Closed Complaints</span>
                    <span className="badge-green text-xs px-2 py-0.5 rounded-full font-bold">{counts.closed}</span>
                  </button>

                  <div className="pt-2 pb-1 px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Reports & Analytics</div>

                  <button
                    onClick={() => setActiveTab('mis_report')}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'mis_report' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                  >
                    <span className="flex items-center gap-2.5"><i className="fa-solid fa-chart-line text-purple-600"></i> DISCOM MIS Matrix</span>
                    <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">Cr</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('district_summary')}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'district_summary' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                  >
                    <span className="flex items-center gap-2.5"><i className="fa-solid fa-map-location-dot text-indigo-600"></i> District Wise Summary</span>
                    <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">75</span>
                  </button>

                  <div className="pt-2 pb-1 px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Public Portal</div>

                  <button
                    onClick={() => setActiveTab('register_public')}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'register_public' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                  >
                    <span className="flex items-center gap-2.5"><i className="fa-solid fa-plus-circle text-teal-600"></i> File Theft Grievance</span>
                    <span className="text-xs text-teal-600 font-bold"><i className="fa-solid fa-bolt"></i></span>
                  </button>

                  {user?.role === 'SUPER_ADMIN' && (
                    <>
                      <div className="pt-2 pb-1 px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider">Admin Directory</div>

                      <button
                        onClick={() => setActiveTab('manage_users')}
                        className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'manage_users' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                      >
                        <span className="flex items-center gap-2.5"><i className="fa-solid fa-users text-teal-600"></i> Manage Users</span>
                        <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">users</span>
                      </button>

                      <button
                        onClick={() => setActiveTab('user_logs')}
                        className={`w-full flex items-center justify-between px-3 py-2.5 rounded-md transition ${activeTab === 'user_logs' ? 'bg-teal-50 text-teal-800 font-bold border-l-4 border-teal-600' : 'text-slate-700 hover:bg-slate-100'}`}
                      >
                        <span className="flex items-center gap-2.5"><i className="fa-solid fa-clipboard-list text-slate-600"></i> User Access Logs</span>
                        <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">logs</span>
                      </button>
                    </>
                  )}
                </nav>

                <div className="p-3 bg-slate-50 border-t border-slate-200 text-xs text-slate-600">
                  <div className="font-semibold text-slate-700">Jurisdiction Active:</div>
                  <div>DISCOM: <span className="font-bold text-slate-900">{user?.discom || 'HQ'}</span></div>
                  <div>Zone: <span className="font-bold text-slate-900">{user?.zone || 'All Zones'}</span></div>
                </div>
              </div>
            </aside>

            {/* Dynamic Main View Area */}
            <main className="flex-1 min-w-0">
              {activeTab === 'not_processed' && (
                <NotProcessedComplaintsView
                  token={token}
                  user={user}
                  districts={districts}
                  notify={notify}
                  refreshBadgeCounts={fetchBadgeCounts}
                />
              )}

              {activeTab === 'forwarded' && (
                <ComplaintQueueView
                  queueType="forwarded"
                  title="Forwarded Complaints & Field Monitoring"
                  subtitle={user?.role === 'SUPER_ADMIN' ? 'Statewide monitoring of grievances forwarded to all UP field divisions.' : (user?.role === 'DISCOM_ADMIN' ? `Monitoring grievances forwarded to ${user.discom} division accounts.` : 'Complaints forwarded to your field division for site inspection and action.')}
                  statusBadge="Forwarded"
                  token={token}
                  user={user}
                  districts={districts}
                  notify={notify}
                  refreshBadgeCounts={fetchBadgeCounts}
                />
              )}

              {activeTab === 'closed' && (
                <ComplaintQueueView
                  queueType="closed"
                  title="Closed / Disposed Complaints"
                  subtitle="Disposed grievance archive with recorded FIR penalties and revenue realizations."
                  statusBadge="Closed"
                  token={token}
                  user={user}
                  districts={districts}
                  notify={notify}
                  refreshBadgeCounts={fetchBadgeCounts}
                />
              )}

              {activeTab === 'mis_report' && (
                <MISReportView token={token} notify={notify} />
              )}

              {activeTab === 'district_summary' && (
                <DistrictSummaryView token={token} notify={notify} />
              )}

              {activeTab === 'register_public' && (
                <PublicRegisterView
                  districts={districts}
                  notify={notify}
                  onSubmitted={() => {
                    fetchBadgeCounts();
                    setActiveTab('not_processed');
                  }}
                />
              )}

              {activeTab === 'manage_users' && (
                <ManageUsersView token={token} notify={notify} />
              )}

              {activeTab === 'user_logs' && (
                <UserLogsView token={token} notify={notify} />
              )}
            </main>
          </div>

          {changePasswordOpen && (
            <ChangePasswordModal
              token={token}
              onClose={() => setChangePasswordOpen(false)}
              notify={notify}
            />
          )}

          {customLoginOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-2xl max-w-sm w-full border border-slate-300 overflow-hidden">
                <div className="bg-slate-800 text-white p-4 flex items-center justify-between">
                  <h3 className="font-bold text-sm flex items-center gap-2">
                    <i className="fa-solid fa-arrow-right-to-bracket text-teal-400"></i> Officer Login (440 Logins)
                  </h3>
                  <button onClick={() => setCustomLoginOpen(false)} className="text-slate-400 hover:text-white text-lg">&times;</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (!customUsername) return notify('Username is required', 'error');
                    switchUser(customUsername.trim(), customPassword.trim());
                    setCustomLoginOpen(false);
                  }}
                  className="p-5 space-y-3 text-xs font-semibold"
                >
                  <div>
                    <label className="text-slate-700 block mb-1">Username (from admin.sql):</label>
                    <input
                      type="text"
                      value={customUsername}
                      onChange={(e) => setCustomUsername(e.target.value)}
                      placeholder="e.g. DVVNL, KeSCO, MVVNL, eddrajapur..."
                      className="w-full border border-slate-300 rounded p-2 text-xs"
                      required
                    />
                  </div>
                  <div>
                    <label className="text-slate-700 block mb-1">Password:</label>
                    <input
                      type="password"
                      value={customPassword}
                      onChange={(e) => setCustomPassword(e.target.value)}
                      placeholder="Default: Admin@123 or admin123"
                      className="w-full border border-slate-300 rounded p-2 text-xs"
                      required
                    />
                    <div className="text-[10px] text-slate-500 font-normal mt-1">
                      Works with DB password or master fallback <code>Admin@123</code> / <code>admin123</code>.
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setCustomLoginOpen(false)}
                      className="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded font-bold shadow"
                    >
                      Log In
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 1. NOT PROCESSED COMPLAINTS VIEW (Exact Parity with notprocess-complaint.php)
    // =========================================================================
    function NotProcessedComplaintsView({ token, user, districts, notify, refreshBadgeCounts }) {
      const [records, setRecords] = useState([]);
      const [pagination, setPagination] = useState({ page: 1, limit: 15, total: 0, totalPages: 1 });
      const [loading, setLoading] = useState(true);

      // Filters matching legacy form: from_date, to_date, district, search
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');
      const [district, setDistrict] = useState('');
      const [search, setSearch] = useState('');

      // Modals
      const [forwardModalData, setForwardModalData] = useState(null);
      const [frivolousModalData, setFrivolousModalData] = useState(null);
      const [actionModalData, setActionModalData] = useState(null);
      const [dossierCid, setDossierCid] = useState(null);

      const fetchRecords = useCallback(async (page = 1) => {
        setLoading(true);
        try {
          const params = new URLSearchParams({
            page: String(page),
            limit: String(pagination.limit)
          });
          if (fromDate) params.append('from_date', fromDate);
          if (toDate) params.append('to_date', toDate);
          if (district) params.append('district', district);
          if (search.trim()) params.append('search', search.trim());

          const res = await fetch(`${API_BASE}/complaints/not-processed?${params.toString()}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to fetch complaints');
          setRecords(data.records || []);
          setPagination(data.pagination || { page: 1, limit: 15, total: 0, totalPages: 1 });
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setLoading(false);
        }
      }, [token, fromDate, toDate, district, search, pagination.limit]);

      useEffect(() => {
        if (token) fetchRecords(1);
      }, [token]);

      const handleFilterSubmit = (e) => {
        e.preventDefault();
        fetchRecords(1);
      };

      const handleExcelExport = () => {
        const params = new URLSearchParams({ status: 'not_processed' });
        if (fromDate) params.append('from_date', fromDate);
        if (toDate) params.append('to_date', toDate);
        if (district) params.append('district', district);
        if (search) params.append('search', search);

        window.open(`${API_BASE}/complaints/export/excel?${params.toString()}&token=${token}`, '_blank');
      };

      return (
        <div className="space-y-4">
          {/* Legacy Lavender Header Block matching notprocess-complaint.php */}
          <div className="lavender-box rounded-lg p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span>Not Processed Complaints Queue</span>
                <span className="text-xs bg-red-600 text-white font-bold px-2 py-0.5 rounded">PRIORITY</span>
              </h2>
              <p className="text-xs text-slate-600">Complaints awaiting initial verification, field division forwarding, or frivolous disposal.</p>
            </div>
            <div>
              <button
                type="button"
                onClick={handleExcelExport}
                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded shadow flex items-center gap-2 transition"
              >
                <i className="fa-solid fa-file-excel"></i> Export To Excel
              </button>
            </div>
          </div>

          {/* Date Filter & Search Form */}
          <form onSubmit={handleFilterSubmit} className="lavender-box rounded-lg p-4 shadow-sm flex flex-wrap items-center gap-3 text-xs font-semibold">
            <span className="text-slate-800 uppercase font-bold flex items-center gap-1.5">

                      <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200 whitespace-nowrap font-mono text-[11px]">

    // =========================================================================
    // 2. FORWARD DIRECTLY TO DIVISION MODAL
    // =========================================================================
    function ForwardToDivisionModal({ complaint, token, notify, onClose, onSuccess }) {
      const [officers, setOfficers] = useState([]);
      const [selectedDiscom, setSelectedDiscom] = useState('ALL');
      const [targetDivision, setTargetDivision] = useState('');
      const [remark, setRemark] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        fetch(`${API_BASE}/complaints/meta/division-officers`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
          .then(r => r.json())
          .then(data => {
            if (data.officers) {
              setOfficers(data.officers);
              if (data.officers.length > 0) setTargetDivision(data.officers[0].username);
            }
          })
          .catch(e => {});
      }, [token]);

      const filteredOfficers = useMemo(() => {
        if (selectedDiscom === 'ALL') return officers;
        return officers.filter(o => o.DISCOM === selectedDiscom);
      }, [officers, selectedDiscom]);

      const handleDiscomChange = (discom) => {
        setSelectedDiscom(discom);
        const filtered = discom === 'ALL' ? officers : officers.filter(o => o.DISCOM === discom);
        if (filtered.length > 0) setTargetDivision(filtered[0].username);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!remark.trim()) return notify('Forwarding instructions are mandatory.', 'error');
        setSubmitting(true);
        try {
          const res = await fetch(`${API_BASE}/complaints/${complaint.complaintNumber}/forward-to-division`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              target_division: targetDivision,
              remark: remark.trim()
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to forward complaint');
          notify(`Complaint #${complaint.complaintNumber} forwarded directly to ${targetDivision}`);
          onSuccess();
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-lg shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden">
            <div className="bg-indigo-900 text-white p-4 flex items-center justify-between">
              <h3 className="font-bold text-sm flex items-center gap-2">
                <i className="fa-solid fa-share"></i> Direct Forwarding &mdash; Ticket #{complaint.complaintNumber}
              </h3>
              <button onClick={onClose} className="text-slate-300 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs font-semibold">
              <div className="space-y-3">
                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-1">
                    <label className="text-slate-700 block mb-1">DISCOM:</label>
                    <select
                      value={selectedDiscom}
                      onChange={(e) => handleDiscomChange(e.target.value)}
                      className="w-full border border-slate-300 rounded p-2 text-xs bg-white text-slate-800 font-bold"
                    >
                      <option value="ALL">All (435)</option>
                      <option value="DVVNL">DVVNL</option>
                      <option value="KeSCO">KeSCO</option>
                      <option value="MVVNL">MVVNL</option>
                      <option value="PuVVNL">PuVVNL</option>
                      <option value="PVVNL">PVVNL</option>
                    </select>
                  </div>
                  <div className="col-span-2">
                    <label className="text-slate-700 block mb-1">Target Field Division (Username):</label>
                    <select
                      value={targetDivision}
                      onChange={(e) => setTargetDivision(e.target.value)}
                      className="w-full border border-slate-300 rounded p-2 text-xs bg-white text-slate-800 font-bold"
                      required
                    >
                      {filteredOfficers.map(o => (
                        <option key={o.id} value={o.username}>
                          {o.username} &mdash; {o.DISCOM} {o.zone ? `(${o.zone})` : ''} {o.circle ? `[${o.circle}]` : ''}
                        </option>
                      ))}
                    </select>
                  </div>
                </div>
                <div className="text-[10px] text-slate-500 font-normal">
                  Showing {filteredOfficers.length} divisional accounts in dropdown.
                </div>
              </div>

              <div>
                <label className="text-slate-700 block mb-1">Forwarding Directive & Raid Instructions:</label>
                <textarea
                  rows="3"
                  value={remark}
                  onChange={(e) => setRemark(e.target.value)}
                  placeholder="Enter specific instructions for field inspection..."
                  className="w-full border border-slate-300 rounded p-2 text-xs text-slate-800"
                  required
                ></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-bold text-slate-700">Cancel</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded flex items-center gap-2">
                  {submitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                  <span>Execute Forwarding</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. CLOSE AS FRIVOLOUS MODAL
    // =========================================================================
    function CloseFrivolousModal({ complaint, token, notify, onClose, onSuccess }) {
      const [remark, setRemark] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!remark.trim()) return notify('Explanatory remark is mandatory.', 'error');
        setSubmitting(true);
        try {
          const res = await fetch(`${API_BASE}/complaints/${complaint.complaintNumber}/close-frivolous`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ remark: remark.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to close complaint as frivolous');
          notify(`Complaint #${complaint.complaintNumber} marked as Frivolous and closed.`);
          onSuccess();
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-lg shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden">
            <div className="bg-slate-800 text-white p-4 flex items-center justify-between">
              <h3 className="font-bold text-sm flex items-center gap-2">
                <i className="fa-solid fa-ban text-red-400"></i> Close as Frivolous &mdash; Ticket #{complaint.complaintNumber}
              </h3>
              <button onClick={onClose} className="text-slate-300 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs font-semibold">
              <p className="text-slate-600">
                You are about to dismiss this complaint as fake, anonymous without actionable location, or unsubstantiated. This will mark the grievance as Closed under category <span className="font-bold text-red-600">Frivolous</span>.
              </p>
              <div>
                <label className="text-slate-700 block mb-1">Dismissal Reason / Officer Finding:</label>
                <textarea
                  rows="3"
                  value={remark}
                  onChange={(e) => setRemark(e.target.value)}
                  placeholder="e.g. स्थल निरीक्षण में कोई पता नहीं मिला / फर्जी शिकायत"
                  className="w-full border border-slate-300 rounded p-2 text-xs text-slate-800"
                  required
                ></textarea>
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-bold text-slate-700">Cancel</button>
                <button type="submit" disabled={submitting} className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded flex items-center gap-2">
                  {submitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                  <span>Confirm Dismissal</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. FIELD ENFORCEMENT & DYNAMIC OUTCOME MODAL (upclosedcomplaint.php)
    // =========================================================================
    function ComplaintActionModal({ complaint, token, notify, onClose, onSuccess }) {
      const [status, setStatus] = useState('closed');
      const [info, setInfo] = useState('Theft Found & FIR Done');
      const [remark, setRemark] = useState('');

      // Sub-fields for Theft Found & FIR
      const [cat, setCat] = useState('lmv2');
      const [loads, setLoads] = useState('2.5');
      const [assess, setAssess] = useState('35000');
      const [reali, setReali] = useState('10000');

      // Sub-fields for Wrong Tariff
      const [scat, setScat] = useState('lmv1');
      const [acat, setAcat] = useState('lmv2');
      const [sload, setSload] = useState('1.0');
      const [aload, setAload] = useState('3.0');

      // Sub-fields for Duplicate
      const [cn, setCn] = useState('');

      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!remark.trim()) return notify('Inspection remark is mandatory.', 'error');
        setSubmitting(true);

        const payload = {
          status,
          remark: remark.trim()
        };

        if (status === 'closed') {
          payload.info = info;

          if (info === 'Theft Found & FIR Done') {
            payload.category = cat;
            payload.loads = loads;
            payload.assess = assess;
            payload.reali = reali;
          } else if (info === 'Wrong Tariff') {
            payload.scat = scat;
            payload.acat = acat;
            payload.sload = sload;
            payload.aload = aload;
            payload.assess = assess;
            payload.reali = reali;
          } else if (info === 'Load Enhancement Case') {
            payload.sload = sload;
            payload.aload = aload;
          } else if (info === 'Duplicate') {
            payload.cn = cn;
          }
        }

        try {
          const res = await fetch(`${API_BASE}/complaints/${complaint.complaintNumber}/update-status`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to update complaint');
          notify(`Complaint #${complaint.complaintNumber} updated successfully (${status} - ${info || ''})`);
          onSuccess();
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-lg shadow-2xl max-w-lg w-full border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
            <div className="bg-teal-800 text-white p-4 flex items-center justify-between shrink-0">
              <h3 className="font-bold text-sm flex items-center gap-2">
                <i className="fa-solid fa-gavel"></i> Enforcement & Action Form &mdash; Ticket #{complaint.complaintNumber}
              </h3>
              <button onClick={onClose} className="text-slate-300 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs font-semibold overflow-y-auto flex-1">
              {/* Status Dropdown */}
              <div>
                <label className="text-slate-700 block mb-1">Select Status:</label>
                <select
                  value={status}
                  onChange={(e) => setStatus(e.target.value)}
                  className="w-full border border-slate-300 rounded p-2 text-xs bg-white text-slate-800 font-bold"
                  required
                >
                  <option value="closed">Close Complaint</option>
                </select>
              </div>

              {/* Theft Info Dropdown when status = closed */}
              {status === 'closed' && (
                <div>
                  <label className="text-slate-700 block mb-1">Theft Info / Enforcement Verdict:</label>
                  <select
                    value={info}
                    onChange={(e) => setInfo(e.target.value)}
                    className="w-full border border-teal-500 rounded p-2 text-xs bg-teal-50 text-teal-900 font-bold"
                    required
                  >
                    <option value="Theft Found & FIR Done">Theft Found & FIR Done (चोरी पुष्ट एवं एफआईआर दर्ज)</option>
                    <option value="Wrong Tariff">Wrong Tariff (गलत टैरिफ)</option>
                    <option value="Load Enhancement Case">Load Enhancement Case (लोड वृद्धि केस)</option>
                    <option value="Duplicate">Duplicate (पुनरावृत्ति शिकायत)</option>

    // =========================================================================
    // 6. GENERIC QUEUE VIEW (In Process & Closed Complaints)
    // =========================================================================
    function ComplaintQueueView({ queueType, title, subtitle, statusBadge, token, user, districts, notify, refreshBadgeCounts }) {
      const [records, setRecords] = useState([]);
      const [pagination, setPagination] = useState({ page: 1, limit: 15, total: 0, totalPages: 1 });
      const [loading, setLoading] = useState(true);
      const [dossierCid, setDossierCid] = useState(null);
      const [actionModalData, setActionModalData] = useState(null);

      const fetchRecords = useCallback(async (page = 1) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/complaints/${queueType}?page=${page}&limit=${pagination.limit}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to fetch complaints');
          setRecords(data.records || []);
          setPagination(data.pagination || { page: 1, limit: 15, total: 0, totalPages: 1 });
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setLoading(false);
        }
      }, [queueType, token, pagination.limit]);

      useEffect(() => {
        fetchRecords(1);
      }, [queueType, token]);

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-lg p-4 shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
              <h2 className="text-xl font-bold text-slate-800">{title}</h2>
              <p className="text-xs text-slate-600">{subtitle}</p>
            </div>
            <span className="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-1 rounded">
              Total: {pagination.total}
            </span>
          </div>

          <div className="bg-white rounded-lg shadow border border-slate-200 overflow-x-auto">
            {loading ? (
              <div className="p-12 text-center text-slate-500 font-semibold"><i className="fa-solid fa-spinner fa-spin text-2xl mb-2 text-teal-600"></i> Loading records...</div>
            ) : records.length === 0 ? (
              <div className="p-12 text-center text-slate-500 font-semibold">No complaints in this register.</div>
            ) : (
              <table className="w-full text-left text-xs text-slate-800 divide-y divide-slate-200">
                <thead className="bg-slate-100 text-slate-700 font-bold uppercase tracking-wider text-[11px]">
                  <tr>
                    <th className="px-3 py-3">Complaint No.</th>
                    <th className="px-3 py-3">Name</th>
                    <th className="px-3 py-3">District</th>
                    <th className="px-3 py-3">Details</th>
                    <th className="px-3 py-3">Assigned Officer</th>
                    {queueType === 'closed' && <th className="px-3 py-3">Enforcement Outcome</th>}
                    {queueType === 'closed' && <th className="px-3 py-3 text-right">Assessed (₹)</th>}
                    {queueType === 'closed' && <th className="px-3 py-3 text-right">Realized (₹)</th>}
                    <th className="px-3 py-3 text-center">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {records.map((r, idx) => (
                    <tr key={r.complaintNumber} className={idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}>
                      <td className="px-3 py-2.5 font-bold font-mono text-teal-700">#{r.complaintNumber}</td>
                      <td className="px-3 py-2.5 font-semibold">{r.thiefname}</td>
                      <td className="px-3 py-2.5">{r.district}</td>
                      <td className="px-3 py-2.5 max-w-[200px] truncate" title={r.complaintDetails}>{r.complaintDetails}</td>
                      <td className="px-3 py-2.5 font-mono text-slate-600">{r.assigned_username || 'None'}</td>
                      {queueType === 'closed' && (
                        <td className="px-3 py-2.5 font-bold text-teal-800">{r.enforcement_verdict || 'Closed'}</td>
                      )}
                      {queueType === 'closed' && (
                        <td className="px-3 py-2.5 text-right font-mono font-bold text-amber-700">₹{r.penalty_assessed || 0}</td>
                      )}
                      {queueType === 'closed' && (
                        <td className="px-3 py-2.5 text-right font-mono font-bold text-emerald-700">₹{r.penalty_realized || 0}</td>
                      )}
                      <td className="px-3 py-2.5 text-center">
                        <div className="flex items-center justify-center gap-1.5">
                          <button
                            onClick={() => setDossierCid(r.complaintNumber)}
                            className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-[10px] px-2 py-1 rounded"
                          >
                            Dossier
                          </button>
                          {queueType === 'forwarded' && !user?.isReadOnly && (
                            <>
                              <button
                                onClick={() => setActionModalData(r)}
                                className="bg-teal-600 hover:bg-teal-700 text-white font-bold text-[10px] px-2 py-1 rounded"
                              >
                                Resolve
                              </button>
                              <button
                                type="button"
                                onClick={() => window.open(`/upclosedcomplaint.html?cid=${r.complaintNumber}`, 'popUpWin', 'width=600,height=650,scrollbars=yes,resizable=yes')}
                                className="bg-slate-700 hover:bg-slate-800 text-white font-bold text-[10px] px-1.5 py-1 rounded"
                                title="Open authentic legacy pop-up window"
                              >
                                <i className="fa-solid fa-arrow-up-right-from-square"></i>
                              </button>
                            </>
                          )}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          {dossierCid && (
            <ComplaintDossierModal cid={dossierCid} token={token} notify={notify} onClose={() => setDossierCid(null)} />
          )}

          {actionModalData && (
            <ComplaintActionModal
              complaint={actionModalData}
              token={token}
              notify={notify}
              onClose={() => setActionModalData(null)}
              onSuccess={() => {
                setActionModalData(null);
                fetchRecords(pagination.page);
                refreshBadgeCounts();
              }}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // 9. ADMIN CHANGE PASSWORD MODAL (change-password.php)
    // =========================================================================
    function ChangePasswordModal({ token, onClose, notify }) {
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [validationError, setValidationError] = useState('');

      const checkValidation = (val) => {
        setNewPassword(val);
        const hasNum = /\d/.test(val);
        const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/.test(val);
        if (val && !(hasNum && hasSpecial)) {
          setValidationError('Password must contain at least one number and one special character.');
        } else {
          setValidationError('');
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!oldPassword) return setValidationError('Current Password field is empty!');
        if (!newPassword) return setValidationError('New Password field is empty!');
        if (!confirmPassword) return setValidationError('Confirm Password field is empty!');
        if (newPassword !== confirmPassword) {
          return setValidationError('Password and Confirm Password field do not match!');
        }
        const hasNum = /\d/.test(newPassword);
        const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/.test(newPassword);
        if (!hasNum || !hasSpecial) {
          return setValidationError('Password must contain at least one number and one special character.');
        }

        setSubmitting(true);
        try {
          const res = await fetch(`${API_BASE}/auth/change-password`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Password update failed');
          notify('Password changed successfully!', 'success');
          onClose();
        } catch (err) {
          setValidationError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-lg shadow-2xl max-w-md w-full overflow-hidden border border-slate-300">
            <div className="p-4 bg-slate-800 text-white flex items-center justify-between">
              <h3 className="font-bold text-sm flex items-center gap-2">
                <i className="fa-solid fa-key text-teal-400"></i> Admin Change Password
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">&times;</button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs font-semibold">
              {validationError && (
                <div className="p-2.5 bg-red-50 text-red-700 border border-red-200 rounded text-xs flex items-center gap-1.5">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                  <span>{validationError}</span>
                </div>
              )}
              <div>
                <label className="text-slate-700 block mb-1">Current Password *</label>
                <input
                  type="password"
                  value={oldPassword}
                  onChange={(e) => setOldPassword(e.target.value)}
                  className="w-full border border-slate-300 rounded p-2 text-xs"
                  required
                />
              </div>
              <div>
                <label className="text-slate-700 block mb-1">New Password *</label>
                <input
                  type="password"
                  value={newPassword}
                  onChange={(e) => checkValidation(e.target.value)}
                  className="w-full border border-slate-300 rounded p-2 text-xs"
                  required
                />
                <span className="text-[10px] text-slate-500 font-normal">Must contain at least 1 number and 1 special character</span>
              </div>
              <div>
                <label className="text-slate-700 block mb-1">Confirm New Password *</label>
                <input
                  type="password"
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  className="w-full border border-slate-300 rounded p-2 text-xs"
                  required
                />
              </div>
              <div className="pt-2 border-t border-slate-100 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border border-slate-300 text-slate-700 rounded font-bold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={submitting}
                  className="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded font-bold shadow flex items-center gap-1.5"
                >
                  {submitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                  <span>Change Password</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // 10. MANAGE USERS VIEW (manage-users.php)
    // =========================================================================
    function ManageUsersView({ token, notify }) {
      const [users, setUsers] = useState([]);
      const [pagination, setPagination] = useState({ page: 1, limit: 15, total: 0, totalPages: 1 });
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [selectedUserId, setSelectedUserId] = useState(null);

      const fetchUsers = async (page = 1) => {
        setLoading(true);
        try {
          const params = new URLSearchParams({ page: String(page), limit: String(pagination.limit) });
          if (search.trim()) params.append('search', search.trim());
          const res = await fetch(`${API_BASE}/auth/users?${params.toString()}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to fetch users');
          setUsers(data.records || []);
          setPagination(data.pagination || { page: 1, limit: 15, total: 0, totalPages: 1 });
        } catch (err) {
          notify(err.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchUsers(1);
      }, [token]);

      const handleDelete = async (id, name) => {
        if (!window.confirm(`Do you really want to delete user "${name}"?`)) return;
        try {
          const res = await fetch(`${API_BASE}/auth/users/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to delete user');
          notify('User deleted successfully', 'success');
          fetchUsers(pagination.page);
        } catch (err) {
          notify(err.message, 'error');
        }

          <div className="lavender-box rounded-lg p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">

            </div>
            <form onSubmit={(e) => { e.preventDefault(); fetchUsers(1); }} className="flex items-center gap-2">
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search Name, Email, Phone..."
                className="border border-slate-300 rounded px-3 py-1.5 text-xs bg-white text-slate-800 w-60"
              />
              <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded text-xs">
                Filter
              </button>
            </form>
          </div>

          <div className="bg-white rounded-lg shadow border border-slate-200 overflow-x-auto">
            {loading ? (
              <div className="p-12 text-center text-slate-500 font-semibold flex items-center justify-center gap-2">
                <i className="fa-solid fa-spinner fa-spin text-teal-600 text-lg"></i> Loading user accounts...
              </div>
            ) : users.length === 0 ? (
              <div className="p-12 text-center text-slate-500 font-semibold">

              </div>
            ) : (
              <table className="w-full text-left border-collapse text-xs">

                  <tr className="bg-slate-100 text-slate-700 uppercase font-bold border-b border-slate-300">

                    <th className="px-3 py-3 text-center">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-slate-700">

                    <tr key={u.id} className="hover:bg-slate-50 transition">
                      <td className="px-3 py-2.5 text-center font-bold text-slate-500">
                        {((pagination.page - 1) * pagination.limit) + idx + 1}

                      <td className="px-3 py-2.5 text-slate-600 font-mono">{u.userEmail}</td>

                      <td className="px-3 py-2.5 text-slate-500">
                        {u.regDate ? new Date(u.regDate).toLocaleString('en-IN') : '—'}

                      <td className="px-3 py-2.5 text-center">
                        <div className="flex items-center justify-center gap-1.5">
                          <button
                            onClick={() => setSelectedUserId(u.id)}

              <div className="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-600">

          {selectedUserId && (
            <UserProfileModal
              userId={selectedUserId}
              token={token}
              notify={notify}
              onClose={() => setSelectedUserId(null)}
            />
          )}
        </div>
      );

                    <th className="px-3 py-3">Login Time</th>
                    <th className="px-3 py-3">Logout Time</th>
                    <th className="px-3 py-3 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-slate-700 font-mono">
                  {logs.map((l, idx) => (
                    <tr key={l.id} className="hover:bg-slate-50 transition">
                      <td className="px-3 py-2.5 text-center font-bold text-slate-500 font-sans">
                        {((pagination.page - 1) * pagination.limit) + idx + 1}
                      </td>
                      <td className="px-3 py-2.5 font-bold text-slate-900">{l.username}</td>
                      <td className="px-3 py-2.5 text-slate-600">{l.userip || '127.0.0.1'}</td>
                      <td className="px-3 py-2.5 text-slate-600">
                        {l.loginTime ? new Date(l.loginTime).toLocaleString('en-IN') : '—'}
                      </td>
                      <td className="px-3 py-2.5 text-slate-500">{l.logout || '—'}</td>
                      <td className="px-3 py-2.5 text-center font-sans">
                        {l.status === 1 ? (
                          <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                            Successful
                          </span>
                        ) : (
                          <span className="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-0.5 rounded-full">
                            Failed
                          </span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}

            {pagination.totalPages > 1 && (
              <div className="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-600 font-sans">
                <div>
                  Showing {((pagination.page - 1) * pagination.limit) + 1} to {Math.min(pagination.page * pagination.limit, pagination.total)} of {pagination.total} log records
                </div>
                <div className="flex items-center gap-1">
                  <button
                    disabled={pagination.page <= 1}
                    onClick={() => fetchLogs(pagination.page - 1)}
                    className="px-2.5 py-1 bg-white border border-slate-300 rounded font-semibold disabled:opacity-50"
                  >
                    Prev
                  </button>
                  <span className="px-2 py-1 font-bold text-teal-700">Page {pagination.page} of {pagination.totalPages}</span>
                  <button
                    disabled={pagination.page >= pagination.totalPages}
                    onClick={() => fetchLogs(pagination.page + 1)}
                    className="px-2.5 py-1 bg-white border border-slate-300 rounded font-semibold disabled:opacity-50"
                  >
                    Next
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
